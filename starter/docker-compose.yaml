# =============================================================================
# docker-compose.yaml — Talon starter
# =============================================================================
# Quick start:
#   1. cp .env.example .env                          # add your secrets
#   2. cp config/talond.example.yaml config/talond.yaml   # edit for your setup
#   3. docker compose up -d
#   4. ./bin/talonctl status                         # or `talonctl status` if installed
# =============================================================================

services:
  talond:
    image: ghcr.io/ivo-toby/talond:latest
    container_name: talond
    restart: unless-stopped

    env_file:
      - .env

    environment:
      NODE_ENV: production
      TALOND_DATA_DIR: /data
      TALOND_CONFIG_PATH: /config/talond.yaml

    networks:
      - default
      - codex-runner

    volumes:
      # Persistent data: SQLite DB, PID file, IPC socket.
      # Bind-mounted (not a named volume) so `talonctl` from the host can reach
      # the socket directly once the host-side CLI ships (today's wrapper uses
      # `docker exec` and works either way).
      - ./data:/data

      # Configuration: bind-mount your edited talond.yaml. NOT read-only
      # because the bundled setup skills and talonctl commands (add-channel,
      # add-persona, bind, …) mutate this file in place.
      - type: bind
        source: ./config/talond.yaml
        target: /config/talond.yaml

      # Personas: edit prompts from the host. Persona dirs live here.
      - type: bind
        source: ./personas
        target: /personas

      # Userdata: a dropbox for files you want the agent to see.
      # Drop PDFs, notes, repos, attachments — the agent reads them at
      # /userdata via its own file tools (Claude's Read, etc.). Persona
      # capabilities don't gate this; access is controlled by what's in the
      # folder. Read+write so the agent can write artifacts back.
      - type: bind
        source: ./userdata
        target: /userdata

      # Skills and sub-agents. Bind-mounted (not optional) so that writes
      # from `talonctl add-mcp` / `add-skill` and any hand-authored skills
      # persist across container recreation. Without these mounts the
      # daemon's /skills and /subagents live only in the container's
      # ephemeral layer and are lost on `docker compose up` / `pull`.
      - type: bind
        source: ./skills
        target: /skills
      - type: bind
        source: ./subagents
        target: /subagents

    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('fs');const p=process.env.TALON_PID_FILE||'/data/talond.pid';if(!fs.existsSync(p)){process.exit(1);}try{process.kill(parseInt(fs.readFileSync(p,'utf8').trim()),0);process.exit(0);}catch{process.exit(1);}"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # Optional contained subscription runner for the codex-sandbox sub-agent
  # provider. Its dedicated /auth state is never mounted into Talon.
  codex-runner:
    profiles: ["codex-sandbox"]
    image: ghcr.io/ivo-toby/talon-codex-runner:latest
    restart: unless-stopped
    environment:
      TALON_CODEX_RUNNER_TOKEN: ${TALON_CODEX_RUNNER_TOKEN:-}
    volumes:
      - codex-runner-auth:/auth
    expose:
      - "9700"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    networks:
      - default
      - codex-runner
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9700/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1024M
          pids: 128
        reservations:
          memory: 256M

volumes:
  codex-runner-auth:
    driver: local

networks:
  codex-runner:
    internal: true
