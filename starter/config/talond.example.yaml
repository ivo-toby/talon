# talond.yaml — Talon starter config
#
# Minimal end-to-end setup: one Telegram channel, one persona, Claude as the
# agent. Copy to `talond.yaml` and edit. See the full reference at
# https://github.com/ivo-toby/talon/blob/main/config/talond.example.yaml

storage:
  type: sqlite
  path: data/talond.sqlite

# ---------------------------------------------------------------------------
# Channels
# ---------------------------------------------------------------------------
channels:
  - type: telegram
    name: personal-telegram
    enabled: true
    config:
      botToken: ${TELEGRAM_BOT_TOKEN}
      # Restrict who can message the bot. Find your Telegram user ID via
      # @userinfobot. Values must be strings, not numbers.
      allowedChatIds:
        - "123456789"
      pollingTimeoutSec: 30

# ---------------------------------------------------------------------------
# Personas — the agent identity and capabilities
# ---------------------------------------------------------------------------
personas:
  - name: assistant
    model: claude-sonnet-4-6
    provider: claude-code
    systemPromptFile: personas/assistant/system.md
    skills: []
    subagents: []
    capabilities:
      allow:
        - channel.send:*
        - memory.access:*
    maxConcurrent: 1

# ---------------------------------------------------------------------------
# Bindings — which persona handles which channel
# ---------------------------------------------------------------------------
bindings:
  - persona: assistant
    channel: personal-telegram
    isDefault: true

# ---------------------------------------------------------------------------
# Durable lifecycle (optional)
# ---------------------------------------------------------------------------
# Leave disabled until you intentionally configure lifecycle handlers and
# persona subscriptions. Lifecycle events are bounded and durable; model-backed
# handlers may propose signals, while native handlers own governed state changes
# such as behavior prompt promotion. If a lifecycle handler uses a sub-agent,
# also add that handler ref to the persona's subagents list.
# lifecycle:
#   enabled: false
#   telemetry:
#     langfuse:
#       publications: false # keep high-volume lifecycle.publish spans out of Langfuse
#       publicationFailures: true
#       handlerDeliveries: true
#   handlers: []
#   retention:
#     completedAuditWindowMs: 2592000000 # 30 days

# ---------------------------------------------------------------------------
# Agent runtime
# ---------------------------------------------------------------------------
agentRunner:
  defaultProvider: claude-code
  providers:
    claude-code:
      enabled: true
      command: claude
      contextWindowTokens: 200000

backgroundAgent:
  enabled: false
  defaultProvider: claude-code
  providers:
    claude-code:
      enabled: true
      command: claude
      contextWindowTokens: 200000

# ---------------------------------------------------------------------------
# Authentication
# ---------------------------------------------------------------------------
# Default: api_key — reads $ANTHROPIC_API_KEY from .env.
# For Claude Max subscription auth, set mode: subscription and bind-mount
# ~/.claude into the container (see https://github.com/ivo-toby/talon/blob/main/starter/README.md).
auth:
  mode: api_key
  providers:
    anthropic:
      apiKey: ${ANTHROPIC_API_KEY}

# Optional contained Codex subscription runner. Start it with
# `docker compose --profile codex-sandbox up -d`, then log into its dedicated
# /auth volume. See the main README's Subscription-backed sub-agents section.
#
# subagentSandbox:
#   codex:
#     enabled: true
#     endpoint: http://codex-runner:9700
#     token: ${TALON_CODEX_RUNNER_TOKEN}
#     startupTimeoutMs: 30000 # wait for supervised runner before daemon starts work

logLevel: info
