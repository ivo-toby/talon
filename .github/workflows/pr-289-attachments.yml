name: PR 289 attachment tests

on:
  push:
    branches:
      - upstream/feat-channel-send-attachments
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-289-attachments-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: TypeScript, lint and attachment tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: "true"
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Attachment and channel tests
        run: |
          npx vitest run \
            tests/unit/tools/host-tools/channel-send.test.ts \
            tests/unit/tools/host-tools/attachment-download.test.ts \
            tests/attachment-config.test.ts \
            tests/unit/channels/connectors/telegram/telegram-connector.test.ts
      - name: Full test suite
        run: npm test
