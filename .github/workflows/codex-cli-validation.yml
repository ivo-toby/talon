name: Codex CLI validation

on:
  push:
    branches:
      - upstream/fix-codex-cli-reliability
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Codex regression tests
        run: npx vitest run tests/unit/providers/codex-cli-provider.test.ts tests/unit/cli/test-provider.test.ts
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Full test suite
        run: npm test
