name: One-time Codex regression validation
on:
  push:
    paths:
      - .github/workflows/temporary-codex-regression.yml
permissions:
  contents: read
jobs:
  codex-regression:
    if: github.repository == 'lukkezen/talon' && github.ref == 'refs/heads/upstream/fix-codex-cli-reliability'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Codex provider and smoke-test regressions
        run: npx vitest run tests/unit/providers/codex-cli-provider.test.ts tests/unit/cli/test-provider.test.ts
      - name: Prettier check
        run: npx prettier --check src/cli/commands/test-provider.ts src/providers/codex-cli-provider.ts tests/unit/cli/test-provider.test.ts tests/unit/providers/codex-cli-provider.test.ts
