name: Verify PR

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_scope:
        description: Test scope to run
        type: choice
        default: targeted
        options:
          - targeted
          - full

permissions:
  contents: read

concurrency:
  group: verify-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, lint, and test
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      CI: true
      FORCE_COLOR: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint (advisory)
        continue-on-error: true
        run: npm run lint

      - name: Select tests
        id: select-tests
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          TEST_SCOPE: ${{ inputs.test_scope || 'targeted' }}
        run: |
          if [ "$TEST_SCOPE" = "full" ]; then
            {
              echo "should_run=true"
              echo "reason=Manual full test scope requested."
              echo "targets=all"
            } >> "$GITHUB_OUTPUT"
            {
              echo '#!/usr/bin/env bash'
              echo 'set -euo pipefail'
              echo 'npm test'
            } > .ci-test-command
            chmod +x .ci-test-command
          else
            node scripts/select-pr-tests.mjs \
              --base "$BASE_SHA" \
              --head "$HEAD_SHA" \
              --github-output "$GITHUB_OUTPUT" \
              --command-file .ci-test-command
          fi

      - name: Test selected targets
        run: |
          echo "Reason: ${{ steps.select-tests.outputs.reason }}"
          echo "Targets: ${{ steps.select-tests.outputs.targets }}"
          if [ "${{ steps.select-tests.outputs.should_run }}" != "true" ]; then
            echo "No Vitest targets selected for this change."
            exit 0
          fi
          bash .ci-test-command
