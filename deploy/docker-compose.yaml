# =============================================================================
# docker-compose.yaml — Talon daemon example Docker Compose setup
# =============================================================================
# Quick start:
#   1. cp config/talond.example.yaml config/talond.yaml
#   2. Edit config/talond.yaml with your API keys and channel settings
#   3. cp deploy/.env.example deploy/.env  (and fill in secrets)
#   4. mkdir -p personas data
#   5. docker compose -f deploy/docker-compose.yaml up -d
# =============================================================================

services:
  talond:
    # Build from the local Dockerfile (or replace 'build' with 'image: talond:latest')
    build:
      context: ..
      dockerfile: deploy/Dockerfile

    container_name: talond

    # Restart the container automatically unless it was explicitly stopped
    restart: unless-stopped

    # Load secrets and overrides from deploy/.env. This is also Compose's
    # interpolation file, so the runner receives only its dedicated token.
    # Never commit .env to version control — add it to .gitignore.
    env_file:
      # Native systemd runner supervision overrides this with the Talon root
      # .env; Docker starter deployments retain the local default.
      - ${TALON_ENV_FILE:-.env}

    environment:
      # Force production mode regardless of what the .env file says
      NODE_ENV: production
      # Point the daemon to the correct in-container paths
      TALOND_DATA_DIR: /data
      TALOND_CONFIG_PATH: /config/talond.yaml

    networks:
      - default
      - codex-runner

    volumes:
      # Persistent data: SQLite database, PID file, IPC sockets
      # Recommendation: Use a bind mount (e.g. ./data:/data) if you want to
      # use 'talonctl' from the host machine without 'docker exec'.
      - talond-data:/data

      # Configuration: bind-mount your edited talond.yaml here
      - type: bind
        source: ../config/talond.yaml
        target: /config/talond.yaml
        read_only: true

      # Personas: bind-mount so you can edit prompts from the host
      # and so Claude Code skills can manage personas.
      # Create the directory first: mkdir -p personas
      - type: bind
        source: ../personas
        target: /personas

      # Optional: Custom skills or sub-agents — uncomment if used
      # - type: bind
      #   source: ../skills
      #   target: /skills
      # - type: bind
      #   source: ../subagents
      #   target: /subagents

      # -----------------------------------------------------------------------
      # Docker socket (optional — only needed for sandbox container spawning)
      # -----------------------------------------------------------------------
      # Mounting the Docker socket gives talond the ability to create and manage
      # sandbox containers on the host. This is a privileged operation — anyone
      # with access to the socket can run containers as root.
      #
      # Security recommendations when enabling:
      #   - Use Docker socket proxy (e.g. Tecnativa/docker-socket-proxy) to
      #     restrict API access to only the endpoints talond needs.
      #   - Use rootless Docker so the socket does not grant root on the host.
      #   - Do NOT expose the socket to untrusted networks.
      #
      # Uncomment the line below to enable sandbox spawning:
      # - /var/run/docker.sock:/var/run/docker.sock

    # Map no ports by default. If you enable the MCP server or webhook mode,
    # uncomment and adjust the relevant port mapping.
    # ports:
    #   - "127.0.0.1:5173:5173"  # MCP server (if enabled in talond.yaml)

    # Health check: verify the daemon process is alive via PID file.
    # Reports unhealthy if the PID file is missing or the process is dead.
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('fs');const p=process.env.TALON_PID_FILE||'/data/talond.pid';if(!fs.existsSync(p)){process.exit(1);}try{process.kill(parseInt(fs.readFileSync(p,'utf8').trim()),0);process.exit(0);}catch{process.exit(1);}"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

    # Drop all Linux capabilities — talond does not need any special privileges
    cap_drop:
      - ALL

    # Prevent privilege escalation via setuid/setgid binaries
    security_opt:
      - no-new-privileges:true

    # Resource limits — adjust based on expected agent workload
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # Optional externally contained Codex subscription runner. Start it with:
  #   docker compose --profile codex-sandbox up -d
  # It intentionally has no Talon data/config/persona mounts and no Docker
  # socket. The persistent /auth volume must belong to a dedicated Codex account.
  codex-runner:
    profiles: ["codex-sandbox"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.codex-runner
    restart: unless-stopped
    environment:
      TALON_CODEX_RUNNER_TOKEN: ${TALON_CODEX_RUNNER_TOKEN:-}
    volumes:
      - codex-runner-auth:/auth
    expose:
      - "9700"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    cap_drop:
      - ALL
    cap_add:
      # The root control process drops each Codex child to uid/gid 10001.
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    networks:
      - default
      - codex-runner
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9700/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1024M
          pids: 128
        reservations:
          memory: 256M

# Named volume for persistent daemon data (survives container restarts)
volumes:
  talond-data:
    driver: local
  codex-runner-auth:
    driver: local

networks:
  codex-runner:
    internal: true
