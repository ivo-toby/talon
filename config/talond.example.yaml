# talond.example.yaml
# Copy to talond.yaml and edit for your environment.
# Canonical config shape validated by src/core/config/config-schema.ts
#
# Deployment modes:
# - Native daemon: see `deploy/talond.service`
# - Container daemon: see `deploy/docker-compose.yaml`
# - Wake-only / timer mode: see `deploy/talond.timer`

storage:
  type: sqlite
  path: data/talond.sqlite

sandbox:
  runtime: docker
  image: talon-sandbox:latest
  maxConcurrent: 3
  networkDefault: off
  idleTimeoutMs: 1800000
  hardTimeoutMs: 3600000
  resourceLimits:
    memoryMb: 1024
    cpus: 1
    pidsLimit: 256

channels:
  - type: telegram
    name: personal-telegram
    enabled: true
    config:
      botToken: ${TELEGRAM_BOT_TOKEN}
      allowedChatIds:
        - "123456789"
      pollingTimeoutSec: 30

  # WhatsApp Web bridge via Baileys — no Meta Business account required.
  # Authenticate first: npx talonctl whatsapp-auth --auth-dir ./baileys-auth
  # Two modes: dedicated number (default) or self-chat (use your personal WhatsApp).
  #
  # Dedicated number:
  # - type: whatsappBaileys
  #   name: my-whatsapp
  #   enabled: true
  #   config:
  #     authDir: './baileys-auth'
  #     allowedSenders:                  # Restrict who can message the bot (recommended)
  #       - '96490886312027'            # Use sender ID from logs (phone number or LID)
  #
  # Self-chat (personal number):
  # - type: whatsappBaileys
  #   name: my-whatsapp
  #   enabled: true
  #   config:
  #     authDir: './baileys-auth'
  #     selfChat: true                   # Listen only to your "Message Yourself" thread
  #     triggerWords: ['@Talon']         # Optional — require trigger word to activate

  # --- Multi-connector example (multiple Slack bots in one workspace) ---
  # Each entry creates an independent bot with its own credentials.
  # Messages between Talon bots in the same workspace are automatically
  # filtered to prevent feedback loops.
  #
  # - name: slack-pm
  #   type: slack
  #   enabled: true
  #   config:
  #     botToken: ${SLACK_PM_BOT_TOKEN}
  #     appToken: ${SLACK_PM_APP_TOKEN}
  #     signingSecret: ${SLACK_PM_SIGNING_SECRET}
  #
  # - name: slack-dev
  #   type: slack
  #   enabled: true
  #   config:
  #     botToken: ${SLACK_DEV_BOT_TOKEN}
  #     appToken: ${SLACK_DEV_APP_TOKEN}
  #     signingSecret: ${SLACK_DEV_SIGNING_SECRET}

# Personas can also be used as profiles for background agents.
# When spawning a background agent with profile="<name>", the named persona's
# system prompt, model, provider, and skills are used instead of the spawning
# thread's persona. Example:
#   background_agent spawn profile="code-reviewer" prompt="Review PR #42"
personas:
  - name: assistant
    model: claude-sonnet-4-6
    provider: claude-code
    # Optional: override provider/model for background_agent spawns.
    # Useful when the foreground stack (e.g. Ollama) is not suitable for
    # long-running background work. Validated at config load against
    # backgroundAgent.providers — daemon refuses to start if the named
    # provider is not enabled there. backgroundModel must be paired with
    # backgroundProvider.
    # backgroundProvider: claude-code
    # backgroundModel: claude-sonnet-4-6
    systemPromptFile: personas/assistant/system.md
    skills: []
    subagents:
      - session-summarizer           # legacy single-summary context compression
      # For observational memory (long-term context), replace session-summarizer with:
      # - session-observer           # generates dated, prioritized observations
      # - session-reflector          # consolidates observations when log grows large
      - memory-groomer
      - memory-retriever
      - file-searcher
    capabilities:
      allow:
        - channel.send:telegram
        - fs.read:*
        - memory.access:*
        - subagent.invoke:*
        - subagent.background
      requireApproval:
        - fs.write:workspace
    mounts:
      - source: data/threads/{thread}/memory
        target: /memory
        mode: ro
      - source: data/threads/{thread}/artifacts
        target: /artifacts
        mode: rw
    maxConcurrent: 2

ipc:
  pollIntervalMs: 500
  daemonSocketDir: data/ipc/daemon

queue:
  maxAttempts: 3
  backoffBaseMs: 1000
  backoffMaxMs: 60000
  concurrencyLimit: 5

agentRunner:
  defaultProvider: claude-code
  providers:
    claude-code:
      enabled: true
      command: claude
      contextWindowTokens: 200000
      contextManagement:
        enabled: true
        triggerMetric: cache_read_input_tokens
        thresholdRatio: 0.5
        recentMessageCount: 10
        summarizer: session-summarizer       # or session-observer for observational memory
        # reflectionThresholdChars: 40000   # OM only: observation log size that triggers session-reflector. Default 40000.
    gemini-cli:
      enabled: false
      command: gemini
      contextWindowTokens: 1000000
      contextManagement:
        enabled: true
        triggerMetric: input_tokens
        thresholdRatio: 0.8
        recentMessageCount: 10
        summarizer: session-summarizer
      options:
        defaultModel: gemini-2.5-pro
    codex-cli:
      enabled: false
      command: codex
      contextWindowTokens: 1048576
      contextManagement:
        enabled: true
        triggerMetric: input_tokens          # OpenAI input_tokens = total context; use this, not cache metrics
        thresholdRatio: 0.5
        recentMessageCount: 10
        summarizer: session-summarizer
      options:
        defaultModel: gpt-5.4
    openai-compatible:
      enabled: false
      command: node
      contextWindowTokens: 256000
      contextManagement:
        enabled: true
        triggerMetric: input_tokens
        thresholdRatio: 0.75
        recentMessageCount: 10
        summarizer: session-summarizer
      options:
        baseUrl: http://127.0.0.1:11434/v1
        defaultModel: qwen3-coder:30b
        providerId: ollama
        # Cap a single tool result's size (in chars) before it enters the
        # agent's message history. The full output is retained in-memory for
        # the current run; the model can fetch ranges via the built-in
        # `fetch_tool_output` tool. Recommended for small-window models
        # (Ollama 8K-32K). Set to 0 to disable. Defaults to 4000 when the
        # key is omitted.
        toolOutputCap: 4000
    # Add more OpenAI-compatible endpoints by giving each provider a unique
    # name and pointing type at the shared implementation.
    ollama-mac:
      enabled: false
      type: openai-compatible
      command: node
      contextWindowTokens: 128000
      contextManagement:
        enabled: true
        triggerMetric: input_tokens
        thresholdRatio: 0.75
        recentMessageCount: 10
        summarizer: session-summarizer
      options:
        baseUrl: http://mac.local:11434/v1
        defaultModel: qwen3-coder:30b
        providerId: ollama-mac
        toolOutputCap: 4000
        # Flat vendor-specific request body fields. Talon wraps this under
        # providerId before calling Mastra, so this becomes
        # providerOptions: { "ollama-mac": { chat_template_kwargs: ... } }.
        providerOptions:
          chat_template_kwargs:
            enable_thinking: false
    omlx-local:
      enabled: false
      type: openai-compatible
      command: node
      contextWindowTokens: 128000
      contextManagement:
        enabled: true
        triggerMetric: input_tokens
        thresholdRatio: 0.75
        recentMessageCount: 10
        summarizer: session-summarizer
      options:
        # oMLX's OpenAI-compatible base URL, including /v1.
        baseUrl: http://mac.local:8000/v1
        defaultModel: qwen3.5-9b-optiq-4bit
        providerId: omlx-local
        # oMLX-specific: use /v1/responses and resume with
        # previous_response_id so oMLX can reuse response state and its
        # prefix/KV cache across tool-call steps and later messages.
        omlxResponses: true
        toolOutputCap: 4000

backgroundAgent:
  enabled: true
  maxConcurrent: 3
  defaultTimeoutMinutes: 30
  defaultProvider: claude-code
  providers:
    claude-code:
      enabled: true
      command: claude
      contextWindowTokens: 200000
    gemini-cli:
      enabled: false
      command: gemini
      contextWindowTokens: 1000000
      options:
        defaultModel: gemini-2.5-pro
    codex-cli:
      enabled: false
      command: codex
      contextWindowTokens: 400000
      options:
        defaultModel: gpt-5.4
    # OpenAI-compatible endpoints (Ollama, Groq, Together, vLLM, …). The
    # wrapper spawns under `node` and reads credentials from the shared
    # auth.providers.<providerId> slot (same as the agentRunner entry above),
    # so no extra auth entries are needed. Streaming is intentionally off in
    # background mode — the wrapper writes the full response to a temp file
    # to bypass the 100 KB stdout buffer cap.
    openai-compatible:
      enabled: false
      command: node
      contextWindowTokens: 256000
      options:
        baseUrl: http://127.0.0.1:11434/v1
        defaultModel: qwen3-coder:30b
        providerId: ollama
    ollama-mac:
      enabled: false
      type: openai-compatible
      command: node
      contextWindowTokens: 128000
      options:
        baseUrl: http://mac.local:11434/v1
        defaultModel: qwen3-coder:30b
        providerId: ollama-mac
        providerOptions:
          chat_template_kwargs:
            enable_thinking: false
    omlx-local:
      enabled: false
      type: openai-compatible
      command: node
      contextWindowTokens: 128000
      options:
        baseUrl: http://mac.local:8000/v1
        defaultModel: qwen3.5-9b-optiq-4bit
        providerId: omlx-local

scheduler:
  tickIntervalMs: 5000

# Agent-to-agent (A2A) limits.
#
# Talon implements the Google A2A protocol so personas can delegate tasks to
# each other (see `persona_send` / `persona_task_status` host tools). These
# knobs cap how aggressive that delegation is allowed to be.
#
# Defaults shown below match the built-in values — omit the entire block to
# accept them.
a2a:
  # Maximum chain depth before a delegated task is rejected. Guards against
  # runaway delegation loops. A task is rejected when `hopCount >= maxHops`.
  # Bounded to 1..32.
  maxHops: 4
  # Maximum in-flight A2A tasks targeting a single persona at once. Additional
  # submissions are rejected until one finishes. Raise this to allow parallel
  # delegation to the same target. Bounded to 1..100.
  maxConcurrentPerTarget: 1
  # Max queue retry attempts for A2A `collaboration` queue items before they
  # move to the dead-letter queue. Bounded to 1..20.
  maxAttempts: 3

auth:
  mode: subscription
  # mode: api_key
  # apiKey: ${SUBAGENT_ANTHROPIC_API_KEY}
  providers:
    anthropic:
      apiKey: ${SUBAGENT_ANTHROPIC_API_KEY}
    openai:
      apiKey: ${OPENAI_API_KEY}
      # baseURL: https://api.openai.com/v1
    # Credentials for the `openai-compatible` agent provider are looked up
    # under auth.providers.<options.providerId> first (e.g. `ollama`, `groq`,
    # `together`), so the same slot can be reused by the matching sub-agent.
    # Falls back to `auth.providers.openai-compatible` for endpoints without
    # a natural provider id.
    # ollama:
    #   apiKey: ${OLLAMA_API_KEY}
    #   baseURL: https://ollama.com/v1
    # openai-compatible:
    #   apiKey: ${OPENAI_COMPATIBLE_API_KEY}
    #   baseURL: https://example.com/v1
    # google:
    #   apiKey: ${GOOGLE_AI_API_KEY}
    #
    # The `ollama` slot is Talon's OpenAI-compatible passthrough. The baseURL
    # MUST include the OpenAI-compatible path prefix (typically `/v1`) — the
    # AI SDK appends paths like `/chat/completions` to it. Use this slot for:
    #   - Local Ollama:  baseURL: http://localhost:11434/v1  (no apiKey needed)
    #   - llama.cpp:     baseURL: http://<host>:8080/v1      (no apiKey needed)
    #   - vLLM:          baseURL: http://<host>:8000/v1      (no apiKey needed)
    #   - Ollama Cloud:  baseURL: https://ollama.com/v1      (apiKey required)
    #   - Any OpenAI-compatible endpoint behind auth (e.g. Cloudflare tunnel).
    #
    # ollama:
    #   baseURL: https://ollama.com/v1
    #   apiKey: ${OLLAMA_API_KEY}

# Langfuse observability — traces agent runs, tool calls, and LLM generations.
# Sign up at https://cloud.langfuse.com or self-host: https://langfuse.com/docs/deployment/self-host
langfuse:
  enabled: false
  publicKey: ${LANGFUSE_PUBLIC_KEY}
  secretKey: ${LANGFUSE_SECRET_KEY}
  baseUrl: https://cloud.langfuse.com
  environment: production
  # release: v1.0.0
  # exportMode: batched           # batched (default) or immediate
  # flushAt: 20                   # spans buffered before flush
  # flushIntervalSeconds: 5       # max seconds between flushes

# Sub-agent model overrides — override which model a sub-agent uses without
# editing its subagent.yaml manifest. Each entry is an ordered failover chain:
# if the first model is unavailable, the next is tried, then the manifest
# default as final fallback.
#
# Per-model fields:
#   provider        — required; one of anthropic, openai, google, ollama.
#                     These are AI SDK model providers, not agent runtime
#                     providers. Do not use codex-cli, claude-code,
#                     gemini-cli, or openai-compatible here.
#   maxTokens       — optional; defaults to the subagent.yaml value
#   timeoutMs       — optional per-model wall-clock timeout (min 1000).
#                     On timeout the runner aborts the in-flight call and
#                     fails over to the next model in the chain.
#   providerOptions — optional free-form record of request body fields
#                     forwarded verbatim to the AI SDK call. Use this to
#                     pass vendor-specific knobs. Only effective on the
#                     `ollama` provider slot (which is Talon's
#                     OpenAI-compatible passthrough — point it at any
#                     compatible endpoint via auth.providers.ollama.baseURL).
#                     Typed providers (anthropic/openai/google) silently
#                     drop unknown fields, so keep providerOptions on the
#                     ollama entry of your chain.
#
# subagents:
#   memory-groomer:
#     model:
#       - provider: ollama
#         name: qwen3-30b
#         # maxTokens: 4096     # optional — falls back to subagent.yaml default
#       - provider: anthropic
#         name: claude-haiku-4-5-20251001
#   session-summarizer:
#     model:
#       - provider: openai
#         name: gpt-5.4-spark
#
# Example: route session-summarizer to Qwen3 via a local llama.cpp endpoint
# with reasoning/thinking disabled, falling back to Claude on failure.
# Configure auth.providers.ollama.baseURL to point at your llama.cpp server.
#
# subagents:
#   session-summarizer:
#     model:
#       - provider: ollama
#         name: Qwen3.5-35B-A3B-UD-Q4_K_XL
#         timeoutMs: 180000
#         maxTokens: 32768
#         providerOptions:
#           chat_template_kwargs:
#             enable_thinking: false
#       - provider: anthropic
#         name: claude-sonnet-4-6
#         timeoutMs: 60000
#         # No providerOptions on the fallback — Claude does not accept
#         # chat_template_kwargs and would silently drop them.

logLevel: info
dataDir: data
