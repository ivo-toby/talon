# talond.example.yaml
# Copy to talond.yaml and edit for your environment.
# Canonical config shape validated by src/core/config/config-schema.ts
#
# Deployment modes:
# - Native daemon: see `deploy/talond.service`
# - Container daemon: see `deploy/docker-compose.yaml`
# - Wake-only / timer mode: see `deploy/talond.timer`

storage:
  type: sqlite
  path: data/talond.sqlite

sandbox:
  runtime: docker
  image: talon-sandbox:latest
  maxConcurrent: 3
  networkDefault: off
  idleTimeoutMs: 1800000
  hardTimeoutMs: 3600000
  resourceLimits:
    memoryMb: 1024
    cpus: 1
    pidsLimit: 256

channels:
  - type: telegram
    name: personal-telegram
    enabled: true
    config:
      token: ${TELEGRAM_BOT_TOKEN}
      allowedUserIds:
        - 123456789
      pollIntervalMs: 1000

  # WhatsApp Web bridge via Baileys — no Meta Business account required.
  # Authenticate first: npx talonctl whatsapp-auth --auth-dir ./baileys-auth
  # Two modes: dedicated number (default) or self-chat (use your personal WhatsApp).
  #
  # Dedicated number:
  # - type: whatsappBaileys
  #   name: my-whatsapp
  #   enabled: true
  #   config:
  #     authDir: './baileys-auth'
  #     allowedSenders:                  # Restrict who can message the bot (recommended)
  #       - '96490886312027'            # Use sender ID from logs (phone number or LID)
  #
  # Self-chat (personal number):
  # - type: whatsappBaileys
  #   name: my-whatsapp
  #   enabled: true
  #   config:
  #     authDir: './baileys-auth'
  #     selfChat: true                   # Listen only to your "Message Yourself" thread
  #     triggerWords: ['@Talon']         # Optional — require trigger word to activate

# Personas can also be used as profiles for background agents.
# When spawning a background agent with profile="<name>", the named persona's
# system prompt, model, provider, and skills are used instead of the spawning
# thread's persona. Example:
#   background_agent spawn profile="code-reviewer" prompt="Review PR #42"
personas:
  - name: assistant
    model: claude-sonnet-4-6
    provider: claude-code
    systemPromptFile: personas/assistant/system.md
    skills: []
    subagents:
      - session-summarizer
      - memory-groomer
      - memory-retriever
      - file-searcher
    capabilities:
      allow:
        - channel.send:telegram
        - fs.read:*
        - memory.access:*
        - subagent.invoke:*
        - subagent.background
      requireApproval:
        - fs.write:workspace
    mounts:
      - source: data/threads/{thread}/memory
        target: /memory
        mode: ro
      - source: data/threads/{thread}/artifacts
        target: /artifacts
        mode: rw
    maxConcurrent: 2

ipc:
  pollIntervalMs: 500
  daemonSocketDir: data/ipc/daemon

queue:
  maxAttempts: 3
  backoffBaseMs: 1000
  backoffMaxMs: 60000
  concurrencyLimit: 5

agentRunner:
  defaultProvider: claude-code
  providers:
    claude-code:
      enabled: true
      command: claude
      contextWindowTokens: 200000
      contextManagement:
        enabled: true
        triggerMetric: cache_read_input_tokens
        thresholdRatio: 0.5
        recentMessageCount: 10
        summarizer: session-summarizer
    gemini-cli:
      enabled: false
      command: gemini
      contextWindowTokens: 1000000
      contextManagement:
        enabled: true
        triggerMetric: input_tokens
        thresholdRatio: 0.8
        recentMessageCount: 10
        summarizer: session-summarizer
      options:
        defaultModel: gemini-2.5-pro

backgroundAgent:
  enabled: true
  maxConcurrent: 3
  defaultTimeoutMinutes: 30
  defaultProvider: claude-code
  providers:
    claude-code:
      enabled: true
      command: claude
      contextWindowTokens: 200000
    gemini-cli:
      enabled: false
      command: gemini
      contextWindowTokens: 1000000
      options:
        defaultModel: gemini-2.5-pro

scheduler:
  tickIntervalMs: 5000

auth:
  mode: subscription
  # mode: api_key
  # apiKey: ${SUBAGENT_ANTHROPIC_API_KEY}
  providers:
    anthropic:
      apiKey: ${SUBAGENT_ANTHROPIC_API_KEY}
    openai:
      apiKey: ${OPENAI_API_KEY}
      # baseURL: https://api.openai.com/v1
    # google:
    #   apiKey: ${GOOGLE_AI_API_KEY}

# Langfuse observability — traces agent runs, tool calls, and LLM generations.
# Sign up at https://cloud.langfuse.com or self-host: https://langfuse.com/docs/deployment/self-host
langfuse:
  enabled: false
  publicKey: ${LANGFUSE_PUBLIC_KEY}
  secretKey: ${LANGFUSE_SECRET_KEY}
  baseUrl: https://cloud.langfuse.com
  environment: production
  # release: v1.0.0
  # exportMode: batched           # batched (default) or immediate
  # flushAt: 20                   # spans buffered before flush
  # flushIntervalSeconds: 5       # max seconds between flushes

# Runtime governance — spending caps, rate limiting, and loop detection.
# All sub-sections are optional. Omit the entire block to disable governance.
governance:
  # Token spending caps. Blocks agent runs when a cap is exceeded.
  # Both daily and hourly are optional; omit either to skip that window.
  spending:
    daily_token_cap: 5000000        # Max tokens per persona per 24h rolling window
    hourly_token_cap: 1000000       # Max tokens per persona per 1h rolling window
    warn_at_percent: 80             # Emit a warning log when usage exceeds this % (1–100)
    # Per-persona overrides — keys are persona names from the personas[] array.
    # per_persona:
    #   researcher:
    #     daily_token_cap: 2000000
    #     hourly_token_cap: 500000

  # Inbound message rate limits. Blocks messages that exceed the sliding-window counts.
  rate_limits:
    inbound_per_minute: 30          # Max inbound messages per channel per minute
    inbound_per_user_per_minute: 10 # Max inbound messages per sender per minute
    api_calls_per_minute: 60        # Reserved for future API rate limiting

  # Loop detection. Catches runaway agents that spin on the same tool calls.
  loop_detection:
    max_turns_per_run: 50           # Hard turn limit per agent run
    duplicate_call_threshold: 5     # Consecutive identical tool calls before blocking
    max_queue_depth_per_thread: 100 # Max queued messages per thread before rejecting

logLevel: info
dataDir: data
